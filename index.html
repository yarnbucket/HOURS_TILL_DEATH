<title>Hours Till Death</title>
<style>
:root{--bg:#05070d;--panel:rgba(7,10,16,.88);--line:rgba(255,255,255,.14);--text:#f4f1eb;--muted:#b9bdc8;--accent:#e8c57a;}
*{box-sizing:border-box} html,body{margin:0;background:#02040a;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{min-height:100svh;overflow-x:hidden}
#app{min-height:100svh;position:relative;background:#05070d}
.photo{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity 1s ease,filter 1s ease;z-index:0}
#photoB{opacity:0}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.38) 45%,rgba(0,0,0,.82) 78%,rgba(0,0,0,.94));}
.fog{position:fixed;inset:-15%;z-index:2;pointer-events:none;opacity:0;filter:blur(18px);background:
radial-gradient(ellipse at 20% 80%,rgba(220,230,235,.25),transparent 40%),
radial-gradient(ellipse at 75% 65%,rgba(220,230,235,.19),transparent 42%),
radial-gradient(ellipse at 50% 100%,rgba(220,230,235,.23),transparent 42%);
animation:fogdrift 14s ease-in-out infinite alternate;transition:opacity .9s ease}
.rain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background-image:repeating-linear-gradient(105deg,transparent 0 18px,rgba(215,230,255,.24) 19px 20px,transparent 21px 38px);background-size:180% 180%;animation:rain .44s linear infinite;transition:opacity .5s}
.lightning{position:fixed;inset:0;z-index:8;pointer-events:none;background:#eaf3ff;opacity:0}
.lightning.hit{animation:flash .55s ease}
.ghostLayer,.creatureLayer{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.ghost{position:absolute;width:90px;height:160px;border-radius:48% 52% 52% 48% / 38% 42% 58% 62%;background:radial-gradient(ellipse at 50% 35%,rgba(245,249,255,.55),rgba(210,225,240,.20) 38%,rgba(210,225,240,0) 72%);filter:blur(2px);opacity:.45}
.bat{position:absolute;font-size:24px;opacity:.72;filter:grayscale(1) brightness(.4)}
.creeper{position:absolute;bottom:4px;font-size:26px;opacity:.78;filter:grayscale(1) brightness(.55)}
@keyframes flash{0%{opacity:0}7%{opacity:.9}14%{opacity:.08}21%{opacity:.7}30%,100%{opacity:0}}
@keyframes rain{from{background-position:0 -140px}to{background-position:-90px 230px}}
@keyframes fogdrift{from{transform:translate3d(-3%,0,0) scale(1.02)}to{transform:translate3d(4%,-2%,0) scale(1.08)}}
@keyframes ghostL{from{transform:translateX(-20vw) translateY(0)}to{transform:translateX(125vw) translateY(-8vh)}}
@keyframes ghostR{from{transform:translateX(120vw) translateY(0)}to{transform:translateX(-30vw) translateY(7vh)}}
@keyframes batfly{from{transform:translateX(-15vw) translateY(0)}to{transform:translateX(120vw) translateY(-18vh)}}
@keyframes creep{from{transform:translateX(-15vw)}to{transform:translateX(120vw)}}
.top{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top)) 16px 8px}
.brand{font-family:Georgia,serif;letter-spacing:.13em;font-weight:800;text-shadow:0 2px 14px #000}
.sound{border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.42);color:#fff;width:46px;height:46px;font-size:19px}
.stage{position:relative;z-index:9;width:min(860px,100%);margin:0 auto;padding:46svh 14px calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:19px;box-shadow:0 24px 70px rgba(0,0,0,.48);backdrop-filter:blur(10px)}
.time{font-size:.82rem;letter-spacing:.16em;color:var(--accent);font-weight:800}
h1{font-family:Georgia,serif;font-size:clamp(1.9rem,8vw,3.3rem);margin:.3rem 0 .9rem;line-height:1.02}
.story{white-space:pre-line;line-height:1.62;font-size:1.02rem}
.footer{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-style:italic;color:#d9d7d2;line-height:1.5}
.choices{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}
.choice{min-height:64px;text-align:left;border:1px solid var(--line);border-radius:15px;padding:12px 14px;background:rgba(15,19,28,.94);color:#fff;transition:transform .16s,border-color .16s}
.choice:active{transform:scale(.985)} .choice strong{display:block;font-size:1rem;margin-bottom:4px} .choice span{display:block;color:var(--muted);line-height:1.35;font-size:.87rem}
@media(min-width:760px){.choices{grid-template-columns:1fr 1fr}}
.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,4,9,.88);backdrop-filter:blur(10px)}
.overlay.show{display:flex} .overlayCard{width:min(700px,100%);background:rgba(7,9,14,.96);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 25px 80px #000}
.overlayCard h2{font-family:Georgia,serif;font-size:2rem;margin:.2rem 0 .8rem} .overlayCard p{white-space:pre-line;line-height:1.65}
.continue{width:100%;min-height:58px;margin-top:12px;border-radius:14px;border:1px solid var(--line);background:#171c28;color:white;font-weight:800}
#intro{position:fixed;inset:0;z-index:50;background:#02040a;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#intro.hidden{display:none} #intro h1{font-size:clamp(2.4rem,12vw,5rem);letter-spacing:.07em} #start{min-width:190px;min-height:58px;border-radius:999px;border:1px solid rgba(255,255,255,.24);background:#10141d;color:white;font-weight:900;letter-spacing:.12em}
#sideQuest .overlayCard{background:rgba(8,8,12,.93)}
#ending{background-size:cover;background-position:center} #ending:before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.12)} #ending .overlayCard{position:relative;background:rgba(248,247,241,.92);color:#111;border-color:rgba(0,0,0,.15)}
.small{font-size:.82rem;color:var(--muted);letter-spacing:.08em}
</style>
</head>

<script>
const IMG_BASE="";
const SCENES=[{"id": "E01", "time": "6:18 PM", "title": "The Drive That Wouldn't Stay Put", "image": "htd_e01_bridge.jpg", "weather": "bridge", "text": "You leave the grind behind and point the car toward the coast. The trip should be automatic by now: highway, bridge, rental, unpack, breathe. Instead Google Maps and Waze start disagreeing before the bay is even visible. One adds twenty-three minutes. The other removes eleven. A reroute puts you on a road you are certain you just left. You switch between the apps to prove one of them is wrong. Neither stays wrong long enough.\n\nThen the Bridge over the Bay rises through the storm clouds.\n\nThe wet roadway throws red and cyan reflections across the windshield. The radio finds a song that fits the moment so perfectly you cannot remember choosing the station. Halfway across, lightning turns the bridge white.\n\nFor one second there is a person standing in the lane ahead.\n\nYou hit the brake.\n\nDarkness returns.\n\nThe headlights find only a pale scrap of material twisting across the pavement.\n\nTraffic keeps moving as if nothing happened.\n\nYour ETA changes again.", "footer": "The bay below looks too large tonight. The song on the radio reaches exactly the right part as you cross.", "effects": {"lightning": 1, "radio": true}, "choices": [{"label": "Keep driving. Don't feed it.", "desc": "Treat the route changes and the figure as exhaustion.", "kind": "forward", "delta": {"dread": 1}, "result": "You keep both hands on the wheel and refuse to look in the mirror. For several miles the navigation behaves. That almost makes it worse."}, {"label": "Compare both apps again.", "desc": "Find out whether either route makes sense.", "kind": "detour", "delta": {"awareness": 1, "drift": 1}, "flag": "routeChecked", "result": "Waze says you will arrive at 7:02. Google Maps says 7:19. You watch both screens. Without either route changing, they switch times. You take a screenshot."}, {"label": "Pull off at the first safe place.", "desc": "Ground yourself before crossing the rest of the bridge.", "kind": "detour", "delta": {"awareness": 1}, "flag": "roadFigure", "result": "At the turnout you look back toward the bridge. Nothing is in the roadway. A strip of pale fabric is caught against the barrier. It looks ordinary until the wind stands it upright for half a second."}, {"label": "Turn the radio up.", "desc": "Let the song carry you across the water.", "kind": "forward", "delta": {"drift": 1}, "flag": "radioOpen", "sfx": "radio", "result": "You turn it up. The next lyric lands on the exact thought in your head. Coincidence. It has to be. Then the station identification gives a time seven minutes earlier than the dashboard clock."}]}, {"id": "E02", "time": "7:02 PM", "title": "The Couch", "image": "htd_e02_couch.jpg", "weather": "clear", "text": "The rental is everything you wanted it to be. Warm lamps. Baseball on television. The balcony doors open toward dark water and a sky still carrying the storm. You drop the luggage, kick off your shoes and collapse onto the couch.\n\nFor the first time in weeks, nobody needs anything from you.\n\nThis was the plan. Get away. Shut the grind off. Let the ocean do the rest.\n\nThe radio is still playing from the speaker on the table. Somehow the song fits this room too.\n\nYou stare through the balcony glass. A pulse of distant lightning turns the ocean silver. For half a heartbeat you think someone is standing near the road below in the same stiff posture as the shape on the bridge.\n\nThe darkness returns before you can focus.\n\nYou could stay exactly where you are.\n\nYou almost do.", "footer": "This is the release. How you choose to unwind becomes the explanation you keep reaching for later.", "effects": {"lightning": 1}, "choices": [{"label": "Pour a drink.", "desc": "Let the day loosen its grip.", "kind": "forward", "delta": {"drift": 1}, "flag": "drink", "sfx": "glass", "result": "The first sip is exactly what you wanted. The room feels warmer. The ocean outside looks farther away than it did a minute ago."}, {"label": "Take a gummy.", "desc": "Give your mind permission to drift.", "kind": "forward", "delta": {"drift": 1}, "flag": "gummy", "result": "You tell yourself the night is officially off the clock. A few minutes later the television crowd seems louder than the room should allow."}, {"label": "Do both.", "desc": "You came here to shut the grind off completely.", "kind": "forward", "delta": {"drift": 2, "dread": 1}, "flag": "both", "sfx": "heartbeat", "result": "For a while everything clicks into place: couch, game, ocean, music. Then you look at the clock and cannot remember when the last song ended."}, {"label": "Skip it and sleep.", "desc": "Stay inside. Morning can have the beach.", "kind": "memory", "delta": {"loop": 1, "dread": 1}, "memoryTarget": 1, "result": "You close your eyes. When they open, your shoes are back on. Your luggage is still zipped. Baseball is showing the same pitch. The clock reads 7:02 PM. Outside, something wet drags once across the balcony and stops."}]}, {"id": "E03", "time": "7:28 PM", "title": "Something Gets You Moving", "image": "htd_e03_firstnight.jpg", "weather": "distant", "text": "The room starts feeling smaller.\n\nYou step onto the porch. Rain has already passed through, leaving the parking lot black and reflective. Beyond the road the ocean is barely visible beneath the storm clouds.\n\nThe radio changes songs inside the rental.\n\nAgain, it fits too perfectly.\n\nLightning flickers behind the clouds. Near the waterline, a human shape stands completely still.\n\nYou blink.\n\nThe sky goes dark.\n\nThe next flicker shows only the wet road, the ocean and a streetlamp.\n\nBehind you, the rental no longer feels relaxing.\n\nIt feels like hiding.\n\nThen the architecture, the railing, the salt air pull another place into your mind: King Charles. Another summer. The Colonel. Always aware. Always somehow in charge of his situation before everyone else understood what the situation was.\n\nYou remember his voice more clearly than you should.\n\nNothing is going to stop you tonight.\n\nAt least that is what you tell yourself.", "footer": "The boardwalk lights glow several blocks away. The ocean is straight ahead. An old memory is pulling from another direction.", "effects": {"lightning": 1}, "choices": [{"label": "Head for the boardwalk.", "desc": "People, lights and food should reset the night.", "kind": "forward", "delta": {"dread": -1}, "result": "You lock the rental and walk toward the lights. With every block the boardwalk noise grows louder. Normal sounds. Normal people. Exactly what you need."}, {"label": "Walk straight to the ocean.", "desc": "You came here for the water. Start there.", "kind": "detour", "delta": {"awareness": 1, "coast": 1}, "flag": "oceanFirst", "result": "You walk to the edge of the access path. The figure is gone. Two wet footprints face inland from a place the tide has not reached."}, {"label": "Investigate the King Charles memory.", "desc": "Find out why the old summer place came back to you now.", "kind": "side", "side": "colonel", "delta": {}, "result": ""}, {"label": "Get in the car and leave.", "desc": "Cross the Bridge over the Bay before this gets stranger.", "kind": "memory", "delta": {"loop": 1, "dread": 1}, "memoryTarget": 2, "result": "You drive for twenty minutes. Waze says seven minutes remain. Google Maps says twenty-six. You pass the same vacancy sign three times. Then your headlights sweep across wet pavement and you realize you are parked outside the rental again. The engine is running. You do not remember turning around."}]}, {"id": "E04", "time": "8:04 PM", "title": "The Boardwalk Makes No Room", "image": "htd_e04_boardwalk.jpg", "weather": "clear", "text": "Good. People.\n\nThe boardwalk is packed. Ice cream signs burn pink and blue against the night. Food stands throw warm light across the wet boards. Families move in both directions. Couples carry drinks. Kids weave through the crowd.\n\nFor thirty seconds you feel ridiculous for being unsettled.\n\nThen you notice nobody makes room for you.\n\nPeople flow around you as if you are fixed to the boards. When you stare directly at a face, it looks ordinary. At the edge of your vision, some look too old, too still, dressed for summers that happened decades ago.\n\nA woman in a white jacket passes you.\n\nA minute later, the same woman passes again from the opposite direction.\n\nSame jacket.\n\nSame drink.\n\nSame expression.\n\nA gull lands on a railing and gives a laugh with the rhythm of a person trying not to laugh out loud.\n\nThen the music from a storefront changes.\n\nThe new song fits exactly what you were thinking.", "footer": "Farther down, an arcade entrance glows against the crowd. Inside, one old machine seems darker than everything around it.", "effects": {"birds": true}, "choices": [{"label": "Push deeper into the crowd.", "desc": "Make the boardwalk admit you exist.", "kind": "corner", "delta": {"dread": 1}, "corner": "crowd", "result": "The crowd closes tighter. For a moment you cannot move forward or back. A child looks directly at you and says, 'You already went this way.' Then the crowd opens as if it never touched you."}, {"label": "Step aside and study the faces.", "desc": "See whether the same people keep appearing.", "kind": "detour", "delta": {"awareness": 1}, "flag": "facePattern", "result": "You stop near a storefront window. In the reflection, three people are dressed differently than the people standing behind you. When you turn, the older clothes are gone."}, {"label": "Follow the laughing gull.", "desc": "Ridiculous—but it keeps looking back at you.", "kind": "detour", "delta": {"awareness": 1, "dread": 1}, "flag": "birdGuide", "sfx": "birds", "result": "The gull hops along the railing, flies twenty feet, lands and waits. It leads you directly to the arcade entrance. Then it laughs once and disappears into the dark."}, {"label": "Enter the arcade.", "desc": "Trade people for machines and fluorescent light.", "kind": "forward", "delta": {"dread": -1}, "result": "The arcade swallows the boardwalk noise. Machines flash. Bells ring. For the first time in several minutes, nobody is touching you."}]}, {"id": "E05", "time": "8:41 PM", "title": "The Machine That Knows", "image": "htd_e05_zoltar.jpg", "weather": "indoor", "text": "The arcade is bright, noisy and almost comforting.\n\nThen Zoltar wakes before you touch him.\n\nA motor catches somewhere inside the cabinet. One bulb pulses. The painted hand twitches over the crystal ball.\n\nYou look around for an employee.\n\nNobody is paying attention.\n\nA card slides into the tray.\n\nYour room number is printed on one side.\n\nYou stop breathing for a second.\n\nOn the other side:\n\nYOU WERE NOT EXPECTED.\n\nYou tilt the card toward the light.\n\nA second line becomes visible beneath the first.\n\nDO NOT SLEEP THROUGH THIS.\n\nA machine behind you erupts in a jackpot sound even though nobody is standing at it.\n\nWhen you look back at Zoltar, his eyes appear to be aimed slightly differently.\n\nProbably the light.\n\nProbably.", "footer": "Outside the arcade, the air smells like rain again. The fortune card feels heavier than paper should.", "effects": {"electric": true}, "choices": [{"label": "Keep the card.", "desc": "Proof belongs in your pocket.", "kind": "forward", "delta": {"awareness": 1}, "flag": "fortuneCard", "result": "You fold the card once and put it somewhere you will not lose it. For the first time tonight, you have physical proof that something is wrong."}, {"label": "Leave it in the tray.", "desc": "A malfunction does not deserve this much attention.", "kind": "memory", "delta": {"loop": 1}, "memoryTarget": 4, "result": "You walk away. At the arcade door your pocket scratches your hand. The fortune card is inside it. You return it to the tray. At the boardwalk exit, it is back in your pocket."}, {"label": "Ask an employee.", "desc": "Find out whether the machine has done this before.", "kind": "detour", "delta": {"awareness": 1, "dread": 1}, "flag": "arcadeAsked", "result": "The employee looks at the card, then at you. 'That machine hasn't printed fortunes in months.' When you look back, Zoltar is dark."}, {"label": "Photograph the card.", "desc": "If the words change, your phone will remember.", "kind": "detour", "delta": {"awareness": 1}, "flag": "photoProof", "result": "The photograph looks normal. Then, while you are looking at it, a third line appears on the screen that is not on the physical card: KEEP MOVING."}]}, {"id": "E06", "time": "9:13 PM", "title": "The Coast Shows Its Teeth", "image": "htd_e06_coast.jpg", "weather": "coast", "text": "The beach gives you the first peaceful minute of the night.\n\nThe clouds open around the moon and silver light stretches across the water. No crowds. No machines. No voices. Just surf.\n\nMaybe this is what you came for.\n\nThen you notice the jellyfish.\n\nOne near the tide line. Three farther up. More scattered beyond them.\n\nToo high on the beach.\n\nThe gulls are not feeding.\n\nThey stand beyond the jellyfish, all facing the same point offshore.\n\nSomething breaks the surface.\n\nThen another.\n\nFish, maybe.\n\nWhatever they are, they are moving toward shore.\n\nFarther out, a darker strip of water cuts through the moonlit surf. It does not break the same way as the waves around it.\n\nThe wind changes.\n\nThe beach does not feel empty anymore.\n\nIt feels evacuated.", "footer": "The beautiful part of the night has shown you exactly where the danger is.", "effects": {"birds": true, "surf": true}, "choices": [{"label": "Study the dark strip of water.", "desc": "Learn the current before it learns you.", "kind": "forward", "delta": {"awareness": 1, "coast": 1}, "flag": "riptideSense", "result": "You watch debris at the edge of the dark strip. It moves seaward while the foam around it moves in. You remember the rule: do not fight straight against a rip current."}, {"label": "Follow the birds' line of sight.", "desc": "See what has made every gull go still.", "kind": "detour", "delta": {"awareness": 1, "dread": 1}, "flag": "offshoreLook", "result": "For several seconds you see nothing. Then a line of small splashes moves parallel to shore—too coordinated to be random. The gulls track it without making a sound."}, {"label": "Walk closer to the jellyfish.", "desc": "Check how far the tide really reached.", "kind": "corner", "delta": {"drift": 1, "dread": 1}, "corner": "jelly", "result": "Your shoe sinks beside one jellyfish. The sand is dry beneath it. It did not wash up here. Something placed it above the tide line."}, {"label": "Back toward the lights.", "desc": "Take the warning and move inland.", "kind": "memory", "delta": {"loop": 1}, "memoryTarget": 5, "result": "You turn toward the boardwalk. After five minutes of walking, moonlight hits another jellyfish at your feet. You look up. You are standing at the same place on the beach."}]}, {"id": "E07", "time": "9:47 PM", "title": "The Missing Minutes", "image": "htd_e07_losttime.jpg", "weather": "distant", "text": "You remember leaving the beach.\n\nYou remember another song starting.\n\nThe next clear memory is standing beside your car with the driver's door open.\n\nYour sleeve is wet.\n\nSand is stuck to one shoe.\n\nYour phone says thirty-seven minutes have passed.\n\nThe navigation screen says you are thirty-seven minutes from home.\n\nYou did not ask for directions home.\n\nThe radio host gives the time. It is twelve minutes earlier than the phone.\n\nIf you had the drink, maybe your memory softened.\n\nIf you took the gummy, maybe the lights and music stretched the minutes.\n\nIf you did both, there is an explanation you do not especially want to examine.\n\nIf you chose neither, there is no comfortable explanation at all.\n\nThen you open your camera roll.\n\nThere is a photograph of the surf taken during the missing time.\n\nYou do not remember taking it.\n\nSomething is standing in the photograph.", "footer": "A scream carries from the direction of the water. It cuts off so cleanly it sounds as if somebody closed a door on it.", "effects": {"radio": true, "thunder": true}, "choices": [{"label": "Open the photograph.", "desc": "Zoom in on whatever is standing near the surf.", "kind": "forward", "delta": {"awareness": 1, "dread": 1}, "flag": "signalSeen", "sfx": "scream", "result": "The figure is blurred, but the posture is familiar: straight, broad-shouldered, watching something outside the frame. It is not facing the camera."}, {"label": "Delete the photograph.", "desc": "You do not need proof of something you cannot explain.", "kind": "memory", "delta": {"loop": 1, "dread": 1}, "memoryTarget": 6, "result": "You delete it. The thumbnail disappears. A second later the photograph is back, now timestamped thirteen minutes earlier."}, {"label": "Check location history.", "desc": "Find out where the missing thirty-seven minutes went.", "kind": "detour", "delta": {"awareness": 1, "drift": 1}, "flag": "locationTrace", "result": "Your location trail draws a tight circle around the beach access, then a straight line over the ocean for nine minutes, then returns to the car."}, {"label": "Call it intoxication and move on.", "desc": "Choose the explanation that lets you keep walking.", "kind": "corner", "delta": {"drift": 1, "dread": 1}, "corner": "denial", "result": "You say it out loud: 'I am just messed up.' The radio stops. From the open car speaker, a voice quietly answers, 'Then why am I here?'"}]}, {"id": "E08", "time": "10:22 PM", "title": "The Water Pulls Back", "image": "htd_e08_riptide.jpg", "weather": "storm", "text": "The scream pulls you back toward the beach.\n\nThe calm is gone.\n\nWind drives across the water. The moon keeps disappearing behind fast clouds. Waves are breaking farther up the sand than they were twenty minutes ago.\n\nLightning flashes.\n\nFor one white frame, a person stands waist-deep beyond the break.\n\nDarkness.\n\nAnother flash.\n\nEmpty water.\n\nA wave reaches your ankles.\n\nThe next one reaches your shins.\n\nThen the water pulls back and the sand begins moving beneath your feet.\n\nNot a wave.\n\nA steady pull.\n\nYou step backward.\n\nYour foot slides toward the dark channel you noticed earlier.\n\nThe night has been playing with memory, music and shadows.\n\nThis is different.\n\nThis can actually kill you.", "footer": "The ocean does not need you to believe in anything.", "effects": {"storm": true, "ghost": 1}, "choices": [{"label": "Move sideways along the shore.", "desc": "Use what you learned about the current.", "kind": "forward", "requires": "riptideSense", "delta": {"awareness": 1, "coast": 1}, "flag": "escapedRip", "result": "You stop fighting the water and move across the pull. Three brutal waves later your feet find firmer sand. The current keeps dragging seaward beside you, angry but empty-handed."}, {"label": "Run straight back.", "desc": "Fight the pull head-on.", "kind": "fatalMaybe", "requires": "riptideSense", "delta": {"dread": 2}, "result": "You dig in and run directly against it.", "death": "The current takes your footing. The last thing you see is lightning turning the beach white while your footprints fill with water."}, {"label": "Reach for the figure.", "desc": "If someone is really out there, they need help.", "kind": "corner", "delta": {"dread": 2, "drift": 1}, "corner": "surfFigure", "result": "You wade two steps toward the figure. Lightning flashes. It is closer than it should be. Another flash: it is behind you on the beach."}, {"label": "Drop low and grab the sand.", "desc": "Give the water less of you to take.", "kind": "corner", "delta": {"dread": 1}, "corner": "sand", "result": "You drop hard and claw into wet sand until the surge passes. Something cold closes around your wrist beneath the foam. When the water withdraws, your wrist is empty—and bruised."}]}, {"id": "E09", "time": "11:01 PM", "title": "The Hotel Forgets You", "image": "htd_e09_hotel.jpg", "weather": "fog", "text": "You retreat inland soaked, cold and angry enough to want ordinary problems again.\n\nThe hotel gives you something worse.\n\nThe desk cannot find your reservation.\n\nYour name is not in the system.\n\nThe room number on your key supposedly belongs to someone who checked in yesterday.\n\nUpstairs, the corridor is exactly where you remember it.\n\nRoom 102.\n\nWarm lamps.\n\nWet boards.\n\nThe King Charles sign glowing beyond the railing.\n\nYou start walking.\n\nOne door.\n\nTwo.\n\nThree.\n\nYou should already be there.\n\nThe corridor keeps going.\n\nYou look back.\n\nRoom 102 is behind you.\n\nYou are certain you never passed it.\n\nA child laughs once from somewhere inside the walls.\n\nThen you remember the Colonel: always aware, always in charge of the situation.\n\nYou stop walking.\n\nThe hallway seems to move one more door without you.", "footer": "At the end of the corridor, one door is slightly open.", "effects": {"fog": true, "ghost": 1, "whisper": "Not your room"}, "choices": [{"label": "Use the fortune card.", "desc": "Compare its warning to the room in front of you.", "kind": "forward", "requires": "fortuneCard", "delta": {"awareness": 1}, "flag": "hotelRhythm", "result": "The room number on the card is not the number on the open door. When you look again, the brass number on the door has changed."}, {"label": "Open the door immediately.", "desc": "It is your room. It has to be.", "kind": "corner", "delta": {"dread": 2}, "corner": "wrongRoom", "result": "The room beyond is furnished exactly like your rental—but older. Your luggage is inside. So are your shoes. You are still wearing both."}, {"label": "Go back to the desk.", "desc": "Make another person acknowledge you exist.", "kind": "memory", "delta": {"loop": 1}, "memoryTarget": 8, "result": "You take the stairs down. The lobby door opens onto the same upstairs corridor. Room 102 is directly in front of you."}, {"label": "Stop and count the doors.", "desc": "Use the Colonel's rule: know your situation.", "kind": "forward", "delta": {"awareness": 1}, "flag": "hallCounted", "result": "You stop moving. The hallway stops moving too. Twelve doors. You count again. Twelve. For the first time, the building seems disappointed."}]}, {"id": "E10", "time": "11:39 PM", "title": "GET OUT", "image": "htd_e10_blackout.jpg", "weather": "drizzle", "text": "Ten minutes ago the boardwalk was packed.\n\nNow there is nobody.\n\nNo families.\n\nNo kids.\n\nNo one carrying fries or ice cream.\n\nJust rainwater, neon and the electrical hum of signs.\n\nYou stand in the middle of the wet boards trying to understand how that many people disappeared without passing you.\n\nA storefront at the far end goes dark.\n\nThen another.\n\nThen another.\n\nThe blackout is moving toward you one shop at a time.\n\nThe radio inside a closed arcade snaps to static.\n\nEvery remaining sign stops humming.\n\nThe rain stops.\n\nFor three seconds the entire coast is silent.\n\nThen a voice speaks from somewhere close enough to raise the hair on your arms.\n\nGET OUT.\n\nNothing follows.\n\nThe lights continue shutting down.", "footer": "The voice did not say what to get out of.", "effects": {"drizzle": true, "fog": true, "whisper": "Get out", "radio": true}, "choices": [{"label": "Follow the blackout.", "desc": "See where the darkness is leading.", "kind": "forward", "delta": {"awareness": 1, "dread": 1}, "flag": "followedDark", "result": "You walk toward each dying sign. The darkness stays one block ahead, almost as if it is clearing the boardwalk for you."}, {"label": "Return to the hotel.", "desc": "Lock the door and wait for morning.", "kind": "memory", "delta": {"loop": 1, "dread": 1}, "memoryTarget": 8, "result": "You turn toward the hotel. The next streetlight flickers. When it steadies, you are standing in the King Charles corridor again, facing Room 102."}, {"label": "Demand an explanation.", "desc": "Call into the empty boardwalk and make something answer.", "kind": "corner", "delta": {"dread": 1}, "corner": "shout", "result": "Your voice travels all the way down the boards. A second later your own voice answers from far ahead: 'GET OUT.'"}, {"label": "Stand still and listen.", "desc": "Do what the Colonel would do: understand the situation first.", "kind": "detour", "delta": {"awareness": 1}, "flag": "heardPattern", "result": "Under the static you hear three sounds repeating: surf, a low electrical pulse, and the same four notes from the song that played on the Bridge over the Bay."}]}, {"id": "E11", "time": "12:18 AM", "title": "The Quick Blast", "image": "htd_e11_storm.jpg", "weather": "fullstorm", "text": "The storm does not roll in.\n\nIt hits.\n\nWind slams the boardwalk. Rain comes sideways. The lamps flicker hard enough to make the whole coastline strobe.\n\nLightning turns everything white.\n\nThree figures stand where the boardwalk was empty a second ago.\n\nDarkness.\n\nThunder punches through the railing.\n\nAnother flash.\n\nOne figure is gone.\n\nAnother is farther away.\n\nThe third is closer.\n\nSomething large skitters underneath the boards and keeps pace with you.\n\nA cluster of bats tears across the sky when the next lightning flash catches them.\n\nAt your feet, something thin slides beneath a bench. A spider races along the wet bottom edge of the railing and disappears.\n\nA woman screams somewhere beyond the shuttered shops.\n\nThen you see the broad-shouldered silhouette at the far end of the boardwalk.\n\nIt faces you.\n\nIt does not approach.", "footer": "The rain begins thinning almost as quickly as it arrived. The silhouette remains.", "effects": {"storm": true, "ghost": 3, "bats": true, "creatures": true, "whisper": "Do not look back"}, "choices": [{"label": "Walk toward the silhouette.", "desc": "Stop letting the night choose the distance.", "kind": "forward", "delta": {"awareness": 1}, "flag": "watcherFaced", "result": "You walk toward it. Lightning flashes twice. The silhouette does not move. Something behind you does. The watcher looks past your shoulder, not at you."}, {"label": "Run the opposite direction.", "desc": "Put blocks between you and whatever it is.", "kind": "memory", "delta": {"loop": 1, "dread": 2}, "memoryTarget": 9, "result": "You sprint through rain and darkness. A sign flashes on. GET OUT. Another sign flashes. GET OUT. When you stop, you are back where you started, facing the same silhouette."}, {"label": "Look beneath the boardwalk.", "desc": "Find the source of the skittering.", "kind": "corner", "delta": {"awareness": 1, "dread": 2}, "corner": "underBoards", "result": "You kneel near the railing. Lightning exposes too many jointed shapes moving below the boards. One stops directly beneath you. You stand before you can decide how large it was."}, {"label": "Stand still through the next flash.", "desc": "Force yourself to see what remains between flashes.", "kind": "forward", "delta": {"awareness": 1}, "flag": "heldGround", "result": "You do not move. Flash. Darkness. Flash. The ghosts change positions. The watcher does not. When the light dies again, you understand that permanence may matter more than appearance."}]}, {"id": "E12", "time": "12:57 AM", "title": "Blood Moon", "image": "htd_e12_bloodmoon.jpg", "weather": "lowfog", "text": "The storm finally breaks.\n\nRain becomes mist.\n\nThe clouds open and the moon comes through red.\n\nAt the end of the path, someone is standing at the railing.\n\nThe same broad-shouldered shape from the photograph.\n\nFrom the storm.\n\nMaybe from the road.\n\nIt does not move toward you.\n\nIt does not raise a hand.\n\nIt simply stands between you and the ocean.\n\nSomething shifts in the fog behind it.\n\nThe watcher turns slightly.\n\nNot toward you.\n\nToward whatever is moving behind it.\n\nAnother shape passes through the mist.\n\nThe watcher moves with it, keeping itself between you and the movement.\n\nFor the first time all night, a worse possibility occurs to you:\n\nYou may have spent hours running from the only thing that knew where the danger was.", "footer": "The red moon begins slipping into shadow. Somewhere nearby, a radio turns itself on.", "effects": {"fog": true, "ghost": 1, "batsMaybe": true, "radio": true, "whisper": "It followed you"}, "choices": [{"label": "Trust the watcher.", "desc": "Follow where it points without knowing why.", "kind": "forward", "delta": {"awareness": 1, "coast": 1}, "flag": "trustedWatcher", "result": "The watcher turns toward the path. You follow. It never looks back, but whenever the fog moves, it stops until you are close enough."}, {"label": "Keep your distance and follow.", "desc": "Use it as a guide, not an ally.", "kind": "forward", "delta": {"awareness": 1}, "flag": "shadowFollow", "result": "You stay twenty paces behind. It walks only when you walk. When you stop, it stops. The distance never changes."}, {"label": "Turn toward the fog.", "desc": "Face whatever the watcher has been blocking.", "kind": "corner", "delta": {"dread": 2, "drift": 1}, "corner": "fogThing", "result": "You step sideways into the mist. For one second you see dozens of pale faces at different distances. Then the watcher grabs the railing—not you—and every face disappears."}, {"label": "Try the bridge again.", "desc": "If there is an exit, it began where the night changed.", "kind": "memory", "delta": {"loop": 1}, "memoryTarget": 11, "result": "You follow the road toward the Bridge over the Bay. The radio gives you directions. Twenty minutes later the blood-red moon appears directly ahead. You are back on the same path behind the watcher."}]}, {"id": "E13", "time": "1:36 AM", "title": "The Eclipse", "image": "htd_e13_eclipse.jpg", "weather": "final", "text": "The eclipse closes over the sky.\n\nAhead, the Bridge over the Bay rises out of the darkness.\n\nYou have seen this bridge before.\n\nOr maybe you have been trying to reach it all night.\n\nRainwater reflects the lights in a straight line toward the other side. Lightning flashes somewhere beyond the bay.\n\nFor the first time since arriving, the road does not twist.\n\nThe radio does not change stations.\n\nYour phone does not reroute.\n\nNothing is stopping you.\n\nThat should feel like relief.\n\nInstead, every instinct tells you not to cross.\n\nThen the shape of the night finally becomes clear.\n\nEvery time you turned away, the night brought you back.\n\nEvery time you tried to sleep, you woke inside the same moment.\n\nEvery attempt to escape before understanding what was happening only tightened the loop.\n\nThe watcher stops at the entrance to the bridge.\n\nIt cannot go farther.\n\nYou can.", "footer": "There has only ever been one way out. The question is whether you can recognize it.", "effects": {"fog": true, "lightning": 2, "ghost": 1, "whisper": "See it through"}, "choices": [{"label": "Walk through it.", "desc": "Carry the night until it has nothing left to put on your shoulders.", "kind": "escape", "delta": {"awareness": 1}, "result": "You step onto the bridge. Nothing attacks. Nothing follows. With every step, the fog thins. Halfway across, the radio becomes an ordinary song. The sky begins to gray."}, {"label": "Follow the radio.", "desc": "Trust the thing that may have been guiding you all night.", "kind": "memory", "delta": {"loop": 1}, "memoryTarget": 12, "result": "You follow the signal off the bridge approach. The song gets clearer. Then the first notes repeat. The blood moon returns above the ocean. You are standing behind the watcher again."}, {"label": "Run across the bridge.", "desc": "Beat the night before it can change its mind.", "kind": "corner", "delta": {"dread": 1}, "corner": "bridgeRun", "result": "You sprint. The bridge lights streak past. The far tower never gets closer. When you stop, gasping, you are exactly where you started. The bridge is not asking for speed."}, {"label": "Close your eyes.", "desc": "Refuse the night one last time.", "kind": "memory", "delta": {"loop": 2, "dread": 1}, "memoryTarget": 1, "result": "You close your eyes. Baseball crowd noise fills the darkness. When you open them, your feet are on the couch. The clock reads 7:02 PM. Your shoes are wet."}]}];
const COLONEL={"title": "King Charles — A Memory From Another Summer", "image": "htd_s01_kingcharles.jpg", "text": "The new rental has reminded you of somewhere else all night.\n\nNow you know where.\n\nKing Charles.\n\nAnother summer. Another version of you.\n\nAnd the Colonel.\n\nAlways watching. Always aware. Always somehow already in control of whatever situation everyone else was still trying to understand.\n\nYou remember him saying, “I am an American.”\n\nThen another old line comes back with it:\n\n“Taxpayers will unite.”\n\nOdd things to remember tonight.\n\nThe corridor stretches farther than memory says it should. Room 102 is open a few inches. At the far end, a man stands beneath the lamps.\n\nYou cannot make out his face.\n\nBut his posture feels familiar.\n\nFor a moment you remember the Colonel's real lesson more clearly than any of the words:\n\nKnow your situation before the situation knows you.", "choices": [{"label": "Walk toward him.", "desc": "See whether the figure is really the Colonel.", "delta": {"awareness": 1, "dread": 1}, "flag": "colonelInvestigated", "result": "You walk slowly, checking doors, reflections and exits. Halfway down, the figure is gone. A wet footprint points back toward Room 102. You gain the feeling that noticing the room mattered more than reaching the man."}, {"label": "Stay still and watch.", "desc": "Let the corridor reveal itself before you move.", "delta": {"awareness": 2}, "flag": "stayAware", "result": "You wait. One lamp flickers. The figure appears one door closer without walking. You do not move. The next flicker puts it back at the far end. The corridor stops changing when you stop reacting."}, {"label": "Call out, “Colonel?”", "desc": "Announce yourself and see what answers.", "delta": {"dread": 1}, "flag": "colonelCalled", "result": "Your voice travels the length of the corridor. No one answers. Then a low voice from somewhere behind you says, “Know your situation.” Room 102 closes by itself."}, {"label": "Leave the memory alone.", "desc": "Some old summers should remain old summers.", "delta": {"loop": 1}, "flag": "colonelIgnored", "result": "You turn away. The King Charles sign goes dark behind you. For the rest of the walk, you hear footsteps that stop whenever you stop."}]};

const TRANSITIONS=["You come off the Bridge over the Bay carrying neon in your eyes and the feeling that something crossed with you.", "The rental gives you somewhere to stop moving. The night gives you reasons not to.", "You leave the porch because hiding already feels heavier than walking.", "The crowd pushes you toward the arcade without ever quite touching you.", "You carry the fortune outside and head for open air, where the coast can finally breathe around you.", "The quiet beach becomes a warning you almost understand too late.", "The missing minutes turn curiosity into fear. Then the scream gives you a direction.", "The water sends you inland looking for walls, locks and something ordinary.", "The hotel gives you neither safety nor certainty. The empty boardwalk offers only distance.", "The voice says GET OUT. The storm answers before you can decide what it meant.", "The storm burns itself out and leaves one figure standing where everything else kept changing.", "The watcher leads you toward the place where the night first stopped behaving.", ""];

function initAudio(){if(audioCtx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C();hum=audioCtx.createOscillator();humGain=audioCtx.createGain();hum.frequency.value=35;hum.type="sine";humGain.gain.value=.018;hum.connect(humGain);humGain.connect(audioCtx.destination);hum.start()}

function tone(f=440,d=.15,v=.04,type="sine",delay=0){if(!state.sound||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+d+.04)}

function spawnGhosts(n=1){const layer=$("ghostLayer");for(let k=0;k<n;k++){const g=document.createElement("div");g.className="ghost";const dir=Math.random()<.5?"L":"R";const size=.55+Math.random()*1.45;g.style.width=(75*size)+"px";g.style.height=(145*size)+"px";g.style.top=(18+Math.random()*58)+"%";g.style.left=dir==="L"?"-18vw":"118vw";g.style.opacity=(.18+Math.random()*.30);g.style.animation=`ghost${dir} ${4.5+Math.random()*4}s linear forwards`;layer.appendChild(g);setTimeout(()=>g.remove(),9500)}}

function setPhoto(name,instant=false){const a=$("photoA"),b=$("photoB"),target=showingA?b:a,current=showingA?a:b;target.style.backgroundImage=`url("${img(name)}")`;applyPhotoPosition(target,name);applyPhotoPosition(current,name);if(instant){current.style.backgroundImage=target.style.backgroundImage;current.style.opacity=1;target.style.opacity=0;return}target.style.opacity=1;current.style.opacity=0;showingA=!showingA}
function clearAtmos(){$("fog").style.opacity=0;$("rain").style.opacity=0;$("ghostLayer").innerHTML="";$("creatureLayer").innerHTML="";try{speechSynthesis.cancel()}catch(e){}}
function atmosphere(s){clearAtmos();const w=s.weather,e=s.effects||{};if(["fog","lowfog","final"].includes(w)||e.fog)$("fog").style.opacity=w==="fog"?".66":".42";if(["drizzle"].includes(w)||e.drizzle)$("rain").style.opacity=".28";if(["storm","fullstorm"].includes(w)||e.storm)$("rain").style.opacity=w==="fullstorm"?".78":".58";if(e.birds)setTimeout(birds,650);if(e.radio)setTimeout(radioFx,700);if(e.thunder)setTimeout(thunder,800);if(e.lightning)for(let i=0;i<e.lightning;i++)setTimeout(flash,700+i*2600);if(e.storm){setTimeout(flash,550);setTimeout(flash,3300)}if(e.ghost){setTimeout(()=>spawnGhosts(e.ghost),1100);if(e.ghost>1)setTimeout(()=>spawnGhosts(Math.max(1,e.ghost-1)),4200)}if(e.bats){setTimeout(spawnBats,2100);if(s.id==="E11"||s.id==="E12")setTimeout(spawnBats,5200)}if(e.creatures){setTimeout(spawnCreepers,2800);if(s.id==="E11")setTimeout(spawnCreepers,6200)}if(e.whisper)setTimeout(()=>whisper(e.whisper),1600)}
function thickenFog(level=".72",ms=2600){const fog=$("fog");fog.style.opacity=level;setTimeout(()=>{const s=SCENES[state.i]||{};const e=s.effects||{};if((["fog","lowfog","final"].includes(s.weather)||e.fog)){fog.style.opacity=s.weather==="fog"?".66":".42"}else{fog.style.opacity=0}},ms)}
function extraFlash(count=1,gap=780){for(let i=0;i<count;i++)setTimeout(flash,140+i*gap)}
function badChoiceBurst(scene,choice){if(!scene)return;const id=scene.id;
 if(id==="E01"){extraFlash(1);setTimeout(radioFx,500)}
 else if(id==="E02"){extraFlash(1);setTimeout(()=>spawnGhosts(1),820)}
 else if(id==="E03"){extraFlash(1);setTimeout(()=>spawnGhosts(1),900)}
 else if(id==="E04"){setTimeout(()=>spawnGhosts(1),800);setTimeout(birds,1200)}
 else if(id==="E05"){setTimeout(radioFx,360)}
 else if(id==="E06"){thickenFog(".38",2200);setTimeout(birds,700)}
 else if(id==="E07"){setTimeout(radioFx,380);setTimeout(()=>spawnGhosts(1),1100)}
 else if(id==="E08"){extraFlash(2,680);setTimeout(()=>spawnGhosts(2),850)}
 else if(id==="E09"){thickenFog(".84",3400);extraFlash(1);setTimeout(()=>spawnGhosts(2),900);setTimeout(spawnCreepers,1800)}
 else if(id==="E10"){thickenFog(".6",2600);setTimeout(()=>spawnGhosts(1),900);setTimeout(()=>whisper("Get out"),1150)}
 else if(id==="E11"){thickenFog(".75",4400);extraFlash(3,620);setTimeout(()=>spawnGhosts(3),800);setTimeout(spawnBats,1500);setTimeout(spawnCreepers,1900)}
 else if(id==="E12"){thickenFog(".56",3200);setTimeout(()=>spawnGhosts(2),900);setTimeout(spawnBats,1700)}
 else if(id==="E13"){thickenFog(".62",3400);extraFlash(2,700);setTimeout(()=>spawnGhosts(2),850)}}
function isBadChoice(c){const d=c.delta||{};return ["memory","corner","fatalMaybe"].includes(c.kind)||(d.loop||0)>0||(d.dread||0)>1}
function adjust(delta={}){for(const [k,v] of Object.entries(delta))state.stats[k]=(state.stats[k]||0)+v}
function render(){const s=SCENES[state.i];setPhoto(s.image);$("time").textContent=s.time;$("title").textContent=s.title;$("story").textContent=s.text;$("footer").textContent=s.footer;const box=$("choices");box.innerHTML="";s.choices.forEach(c=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`<strong>${c.label}</strong><span>${c.desc}</span>`;b.onclick=()=>choose(c);box.appendChild(b)});atmosphere(s);window.scrollTo({top:0,behavior:"smooth"})}
function showResult(title,text,tag="THE NIGHT MOVES"){return new Promise(resolve=>{$("resultTag").textContent=tag;$("resultTitle").textContent=title;$("resultText").textContent=text;$("result").classList.add("show");$("resultBtn").onclick=()=>{$("result").classList.remove("show");resolve()}})}
async function memoryBlur(c){await showResult("Something feels familiar",c.result,"MEMORY BLUR");state.i=c.memoryTarget;render()}
async function corner(c){await showResult("You put yourself in a corner",c.result,"NO EASY EXIT");adjust({awareness:1});if(state.stats.dread>8&&state.stats.loop>3){die("You keep choosing smaller and smaller places until the night finally finds one you cannot leave.");return}advance()}
function advance(){if(state.i<SCENES.length-1){const t=TRANSITIONS[state.i];state.i++;if(t)showResult("Keep moving",t,"BETWEEN MOMENTS").then(render);else render()}}
async function choose(c){await wakeAudio();const scene=SCENES[state.i];adjust(c.delta);if(c.flag)state.flags.add(c.flag);state.history.push({scene:scene.id,choice:c.label});if(c.sfx==="radio")radioFx();if(c.sfx==="birds")birds();if(c.sfx==="scream")scream();if(isBadChoice(c))badChoiceBurst(scene,c);
if(c.kind==="side"){openColonel();return}
if(c.kind==="escape"){await showResult("You go through",c.result,"THE ONLY WAY OUT");morning();return}
if(c.kind==="memory"){await memoryBlur(c);return}
if(c.kind==="corner"){await corner(c);return}
if(c.kind==="fatalMaybe"){if(c.requires&&!state.flags.has(c.requires)){die(c.death);return}await showResult("The water fights back","You remember the dark channel just in time and break sideways out of the pull. You survive, but only because something earlier taught you what not to do.","YOU ALMOST LOST IT");advance();return}
if(c.requires&&!state.flags.has(c.requires)){await showResult("You are missing something","The choice feels right, but the night does not open for it. You are forced back into the scene until you notice what you missed.","THE PATH DOES NOT OPEN");adjust({loop:1,dread:1});render();return}
await showResult(c.label,c.result,"CONSEQUENCE");advance()}
function openColonel(){setPhoto(COLONEL.image);clearAtmos();$("fog").style.opacity=".35";$("sideTitle").textContent=COLONEL.title;$("sideText").textContent=COLONEL.text;const box=$("sideChoices");box.innerHTML="";COLONEL.choices.forEach(c=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`<strong>${c.label}</strong><span>${c.desc}</span>`;b.onclick=async()=>{adjust(c.delta);if(c.flag)state.flags.add(c.flag);await showResult(c.label,c.result,"KING CHARLES");$("sideQuest").classList.remove("show");state.i=3;render()};box.appendChild(b)});$("sideQuest").classList.add("show")}
function die(t){$("deathText").textContent=t;$("death").classList.add("show");scream()}
function morning(){clearAtmos();$("ending").style.backgroundImage=`url("${img("htd_end01_morning.jpg")}")`;$("ending").style.backgroundPosition=photoPos("htd_end01_morning.jpg");$("endingText").textContent="Morning arrives without ceremony. No thunder. No fog. No voices in the radio. People walk the boardwalk carrying coffee and beach bags. A gull steals something from a trash can. The ocean is just the ocean again.\n\nFor the first time all night, nothing happening feels incredible.\n\nThen your phone wakes in your hand.\n\nYour camera roll is open.\n\nThirteen photographs.\n\nYou recognize every place.\n\nYou do not remember taking all of them.";$("ending").classList.add("show")}
function reset(){state.i=0;state.stats={awareness:0,drift:0,dread:0,loop:0,coast:0};state.flags.clear();state.history=[];["death","ending","result","sideQuest"].forEach(x=>$(x).classList.remove("show"));setPhoto(SCENES[0].image,true);render()}
$("start").onclick=async()=>{await wakeAudio();$("intro").classList.add("hidden");setPhoto(SCENES[0].image,true);render()};
$("soundBtn").onclick=async()=>{await wakeAudio();state.sound=!state.sound;$("soundBtn").textContent=state.sound?"🔊":"🔇";if(humGain&&audioCtx)humGain.gain.setTargetAtTime(state.sound?.018:0,audioCtx.currentTime,.03);if(!state.sound)try{speechSynthesis.cancel()}catch(e){}};
$("deathBtn").onclick=reset;$("endingBtn").onclick=reset;
document.addEventListener("pointerdown",wakeAudio,{once:true,passive:true});
window.addEventListener("resize",()=>{const n=SCENES[state.i]?.image||SCENES[0].image;applyPhotoPosition($("photoA"),n);applyPhotoPosition($("photoB"),n);$("ending").style.backgroundPosition=photoPos("htd_end01_morning.jpg")});
setPhoto(SCENES[0].image,true);
</script>
</body>
